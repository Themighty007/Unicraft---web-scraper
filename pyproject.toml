[project]
name = "unicraft-scraper"
version = "0.1.0"
description = "Multi-level company intelligence and web scraping tool with discovery, dynamic JS rendering, custom selectors, and a live scheduling dashboard."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.1",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "playwright>=1.65.2",
    "pydantic>=2.14.4",
    "pyyaml>=6.0.4",
    "rich>=15.0.0",
    "typer>=0.29.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
unicraft = "scraper.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scraper"]
